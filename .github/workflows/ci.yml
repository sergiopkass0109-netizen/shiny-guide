name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Verification suite (three engines, published anchors, page sync)
        run: npm test
      - name: CLI smoke test
        run: |
          node cli.js 1e6 | head -1
          node cli.js --pi 1e9 --engine all
